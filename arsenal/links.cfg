# xos: view an image inline while reading a served zim or any html/http page.
# staged by arsenal/provision-lib.sh to $H/.links/links.cfg -- a fresh
# provision run overwrites this file, so edit it here, not on the stick.
#
# format verified against the pinned links-2.30 source (build-arsenal-c.sh /
# arsenal.pins): default.c's type_rd() reads one "association" line as five
# get_token()'d fields -- label, a comma-separated content-type list (matched
# by is_in_list(), exact strings, no wildcards), the program (subst_file()
# replaces a literal % with the downloaded file's path -- not %s), a flags
# int, and a system id. flags 49 = cons(1) + block(16) + accept_http(32):
# usable from the console build (no X in this arsenal), run in the
# foreground so `q` in view returns to the page, and usable for a zim/http
# fetch, not local files only. system 1 = SYS_UNIX (os_dep.h).
#
# p3 is noexec, so the program is the same xexec run-form arsenal's own
# runform() prints for view -- see arsenal:32.
association "view image" "image/png,image/jpeg,image/gif,image/webp" "sh ~/tools/xexec -t ~/tools/python bin/python3 ~/tools/view %" 49 1
